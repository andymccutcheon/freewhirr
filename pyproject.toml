[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freewhirr"
dynamic = ["version"]
description = "Free-first OpenRouter router and OpenAI-compatible proxy. Spend nothing until you choose to."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andy McCutcheon" }]
keywords = [
    "openrouter",
    "llm",
    "router",
    "free",
    "openai",
    "anthropic",
    "proxy",
    "failover",
    "codex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/andymccutcheon/freewhirr"
Repository = "https://github.com/andymccutcheon/freewhirr"
Issues = "https://github.com/andymccutcheon/freewhirr/issues"
Changelog = "https://github.com/andymccutcheon/freewhirr/blob/main/CHANGELOG.md"

[project.scripts]
freewhirr = "freewhirr.cli:main"

[tool.setuptools.dynamic]
version = { attr = "freewhirr._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
freewhirr = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["freewhirr"]
