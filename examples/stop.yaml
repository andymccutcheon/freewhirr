# Never spend money. If every free model fails, freeloader raises and stops.
exhaustion_policy: stop
include_discovered_free: true
# Optional pin / priority list. Discovered $0 models are appended after these.
free_models: []
deny_data_collection: false
model_cache_ttl: 3600
timeout: 60
max_retries: 2
state_backend: sqlite
# state_path: ~/.freeloader/state.sqlite
baseline_paid_model: openai/gpt-4o-mini
